<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Stream</title>
    <style>
        :root { --bg: #09090b; --card: #18181b; --border: #27272a; --text: #f4f4f5; --muted: #71717a; --accent: #3b82f6; --accent-hover: #2563eb; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; height: 100vh; }
        
        main { width: 100%; max-width: 750px; display: flex; flex-direction: column; height: 100%; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
        
        header { padding: 1.5rem; border-bottom: 1px solid var(--border); background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-between; }
        header h1 { font-size: 1.2rem; font-weight: 600; border-left: 3px solid var(--accent); padding-left: 10px; }
        .status-pill { font-size: 0.75rem; color: #22c55e; background: rgba(34, 197, 94, 0.1); padding: 0.25rem 0.6rem; border-radius: 9999px; font-weight: 500; }
        
        #chat-window { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        
        .msg { max-width: 80%; padding: 0.85rem 1.15rem; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; animation: fadeIn 0.2s ease; }
        .user-msg { background-color: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background-color: var(--card); border: 1px solid var(--border); color: #e4e4e7; align-self: flex-start; border-bottom-left-radius: 2px; white-space: pre-wrap; }
        .system-error { background-color: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; align-self: center; font-size: 0.85rem; border-radius: 6px; }
        
        #input-area { padding: 1.5rem; border-top: 1px solid var(--border); display: flex; gap: 0.75rem; background: var(--bg); }
        input[type="text"] { flex: 1; background-color: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: var(--accent); }
        
        button { background-color: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0.75rem 1.25rem; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; justify-content: center; min-width: 80px; }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { background-color: var(--card); border: 1px solid var(--border); color: var(--muted); cursor: not-allowed; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>AI Chat Gateway</h1>
            <span class="status-pill">Connected</span>
        </header>

        <div id="chat-window">
            <div class="msg ai-msg">Hello! Enter a prompt below to communicate with the application stream pipeline.</div>
        </div>

        <form id="input-area" onsubmit="sendMessage(event)">
            <input type="text" id="user-input" placeholder="Type your prompt message here..." autocomplete="off" required>
            <button type="submit" id="send-btn">Send</button>
        </form>
    </main>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, isUser, isError = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isError ? 'system-error' : isUser ? 'user-msg' : 'ai-msg'}`;
            msgDiv.textContent = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Render user text bubble & reset UI state
            appendMessage(text, true);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.textContent = 'Thinking...';

            try {
                // Forward request payload directly to local Vercel serverless pipeline 
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();

                if (response.ok) {
                    // Extract reply key matching backend engine structures
                    const aiReply = data.reply || "No response field returned.";
                    appendMessage(aiReply, false);
                } else {
                    appendMessage(`Error (${response.status}): ${data.error || 'Server error'}`, false, true);
                }
            } catch (err) {
                appendMessage(`Network connection failed: ${err.message}`, false, true);
            } finally {
                // Restore interactive layouts
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
                userInput.focus();
            }
        }
    </script>
</body>
</html>
